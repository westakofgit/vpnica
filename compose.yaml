name: vpnica

services:
  openvpn:
    image: ${OPENVPN_IMAGE}
    container_name: vpnica-openvpn
    restart: unless-stopped
    ports:
      - "${OPENVPN_PORT}:${OPENVPN_PORT}/udp"
    volumes:
      - ./state/openvpn:/etc/openvpn
      - ./config/openvpn/vpn.env:/vpn.env:ro
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  telemt:
    image: ${TELEMT_IMAGE}
    container_name: vpnica-telemt
    restart: unless-stopped
    ports:
      - "${TELEMT_PORT}:443/tcp"
    working_dir: /run/telemt
    command:
      - /etc/telemt/config.toml
    volumes:
      - ./state/telemt/config.toml:/etc/telemt/config.toml:ro
    tmpfs:
      - /run/telemt:rw,mode=1777,size=4m
    environment:
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "/app/telemt", "healthcheck", "/etc/telemt/config.toml", "--mode", "liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 262144
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
